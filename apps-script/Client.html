<script>
(()=>{'use strict';
let data=null,loading=false,lastSuccess=null,token='',requestId=crypto.randomUUID(),round='all',fakeOutage=false,challengeBusy=false,submitting=false,consentVersion='';
const $=id=>document.getElementById(id), form=$('registration'),isDemo=!window.google?.script?.run;
const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=(v,opts={day:'numeric',month:'long',year:'numeric'})=>!v?'Nije određeno':Number.isFinite(Date.parse(v))?new Intl.DateTimeFormat('sr-Latn-BA',{...opts,timeZone:'Europe/Belgrade'}).format(new Date(v)):'Termin nije ispravno unesen';
const dayKey=v=>v&&Number.isFinite(Date.parse(v))?new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Europe/Belgrade'}).format(new Date(v)):'';
const category=id=>data.kategorije.find(c=>c.id===id)?.naziv||'Kategorija';
const player=id=>data.ucesnici.find(p=>p.id===id)?.javno_ime||(id?'Učesnik nedostupan':'Čeka se protivnik');
const empty=message=>'<div class="empty">'+escape(message)+'</div>';
function rpc(name,input){return new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(new Error('Veza nije odgovorila na vrijeme. Pokušajte ponovo; isti zahtjev neće biti upisan dvaput.')),25000);const ok=v=>{clearTimeout(timer);resolve(v)},bad=e=>{clearTimeout(timer);reject(e)};if(isDemo){if(fakeOutage){bad(new Error('Simuliran prekid veze.'));return;}fetch('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input||{})}).then(async r=>{let v=await r.json();if(!r.ok)throw new Error(v.error||'Usluga nije dostupna.');return v;}).then(ok,bad);}else google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[name](input);});}
function options(id,rows,blank){let select=$(id),current=select.value;select.innerHTML=(blank!==null?'<option value="">'+escape(blank)+'</option>':'')+rows.map(r=>'<option value="'+escape(r.id)+'">'+escape(r.naziv)+'</option>').join('');if([...select.options].some(o=>o.value===current))select.value=current;}
function badge(status){return '<span class="badge '+(status==='U toku'?'live':status==='Otkazan'||status==='Odgođen'?'closed':'')+'">'+escape(status)+'</span>';}
function roundName(m){let max=Math.max(...data.mecevi.filter(x=>x.kategorija_id===m.kategorija_id).map(x=>Number(x.runda)));return Number(m.runda)===max?'Finale':Number(m.runda)===max-1?'Polufinale':Number(m.runda)===max-2?'Četvrtfinale':'Runda '+m.runda;}
function card(m){const score=String(m.setovi||'').split(/\s+/).filter(Boolean).map(s=>s.match(/^(\d+)-(\d+)(?:\((\d+)-(\d+)\))?$/)),scores=[0,1].map(i=>score.map(s=>s?escape(s[i+1])+(s[3]?'<sup>'+escape(s[i+3])+'</sup>':''):'').join(' '));return '<article class="match"><div class="match-meta"><span>'+escape(category(m.kategorija_id))+' · '+escape(roundName(m))+'</span>'+badge(m.status)+'</div>'+[1,2].map((i)=>'<div class="player-line '+(m.pobjednik_id&&m['igrac'+i+'_id']===m.pobjednik_id?'winner':'')+'"><span>'+escape(m['igrac'+i+'_id']?player(m['igrac'+i+'_id']):m.ishod==='Slobodan prolaz'?'Slobodan prolaz':'Čeka se protivnik')+(m.pobjednik_id&&m['igrac'+i+'_id']===m.pobjednik_id?' <span aria-label="Pobjednik">✓</span>':'')+'</span><span class="score">'+scores[i-1]+'</span></div>').join('')+'<div class="match-bottom"><span>'+escape(m.pocetak?date(m.pocetak,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Termin naknadno')+'</span><span>'+escape(m.ishod&&m.ishod!=='Regularno'?m.ishod:data.tereni.find(t=>t.id===m.teren_id)?.naziv||'Teren naknadno')+'</span></div></article>';}
function render(){const t=data.turnir;if(!isDemo){$('demo').hidden=![true,'TRUE','DA'].includes(t.demo);$('outage').hidden=true;$('demoText').textContent='DEMO TURNIR · Koristite samo izmišljene podatke. Ovo je probna Google Sheets baza.';}if(consentVersion && consentVersion!==t.verzija_pravila){form.elements.saglasnost.checked=false;consentVersion='';$('formMessage').textContent='Pravila su izmijenjena. Ponovo ih pročitajte i potvrdite.';}$('title').textContent=t.naziv||'Teniski turnir';document.title=t.naziv||'Teniski turnir';$('description').textContent=t.opis||'Informacije o turniru biće objavljene uskoro.';$('registrationStatus').textContent=t.status_prijava==='Otvorene'&&Date.parse(t.rok_prijave)>Date.now()?'Prijave otvorene':'Prijave zatvorene';$('facts').innerHTML='<span>⌖ '+escape(t.lokacija||'Lokacija uskoro')+'</span><span>▦ '+escape(t.datum_od?date(t.datum_od)+' — '+date(t.datum_do):'Datumi uskoro')+'</span>';$('stats').innerHTML=[[data.ucesnici.length,'Potvrđenih učesnika'],[data.kategorije.length,'Kategorija'],[data.mecevi.filter(m=>m.status==='Završen').length,'Završenih mečeva'],[data.tereni.length,'Terena']].map(([n,label])=>'<div class="stat"><strong>'+n+'</strong><span>'+label+'</span></div>').join('');
const notice=n=>'<article class="notice '+(Number(n.prioritet)>=3?'urgent':'')+'"><strong>'+escape(n.naslov)+'</strong><p>'+escape(n.tekst)+'</p></article>';$('notice').innerHTML=data.obavjestenja[0]?notice(data.obavjestenja[0]):'';$('allNotices').innerHTML=data.obavjestenja.map(notice).join('');
let upcoming=data.mecevi.filter(m=>['Zakazan','U toku'].includes(m.status)).sort((a,b)=>(a.pocetak||'9999').localeCompare(b.pocetak||'9999')).slice(0,3);$('upcoming').innerHTML=upcoming.length?upcoming.map(card).join(''):empty('Raspored narednih mečeva još nije objavljen.');
$('categories').innerHTML=data.kategorije.map(c=>'<article class="category"><h3>'+escape(c.naziv)+'</h3><p>'+escape(c.format)+'</p><div class="capacity"><span style="width:'+Math.min(100,Number(c.zauzeto)/Number(c.limit_ucesnika)*100)+'%"></span></div><div class="category-bottom"><span>'+Number(c.zauzeto)+' / '+Number(c.limit_ucesnika)+' prijava</span><strong>'+escape(Number(c.kotizacija)?c.kotizacija+' '+c.valuta:'Bez kotizacije')+'</strong></div></article>').join('')||empty('Kategorije će uskoro biti objavljene.');
options('playerCategory',data.kategorije,'Sve kategorije');options('drawCategory',data.kategorije,null);options('formCategory',data.kategorije,'Izaberite kategoriju');options('matchCategory',data.kategorije,'Sve kategorije');options('matchCourt',data.tereni,'Svi tereni');options('matchDay',[...new Set(data.mecevi.map(m=>dayKey(m.pocetak)).filter(Boolean))].sort().map(d=>({id:d,naziv:date(d)})),'Svi dani');
$('rules').textContent=t.pravila||'Organizator još nije objavio pravila.';$('privacy').textContent=t.obrada_podataka||'Obavještenje još nije objavljeno. Prijave su onemogućene.';$('rulesVersion').textContent='Verzija pravila i obavještenja: '+(t.verzija_pravila||'nije određena');$('contact').textContent=t.kontakt_javni||'Javni kontakt još nije objavljen.';$('location').textContent=t.lokacija||'Lokacija još nije određena.';$('deadlineHelp').textContent='Rok prijave: '+date(t.rok_prijave,{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
$('categoryRules').innerHTML=data.kategorije.map(c=>'<article class="paper"><h2>'+escape(c.naziv)+'</h2><p>'+escape(c.format)+'. Za pobjedu: '+Number(c.setovi_za_pobjedu)+' set(a). Set do '+Number(c.gemovi_u_setu)+' gemova; taj-brejk na '+Number(c.tajbrejk_na)+':'+Number(c.tajbrejk_na)+' do '+Number(c.tajbrejk_poeni)+' poena uz dva razlike.</p><p class="multiline">'+escape(c.pravila||'')+'</p></article>').join('');renderPlayers();renderDraw();renderMatches();availability();route();}
function availability(){if(!data)return;const t=data.turnir,c=data.kategorije.find(c=>c.id===$('formCategory').value);let message='Prijava čeka pregled organizatora.';let blocked=false;if(t.status_prijava!=='Otvorene'||!Number.isFinite(Date.parse(t.rok_prijave))||Date.parse(t.rok_prijave)<=Date.now()){message='Prijave su zatvorene ili rok još nije određen.';blocked=true;}else if(!t.pravila||!t.obrada_podataka||!t.verzija_pravila){message='Organizator još nije objavio potrebna pravila i obavještenje.';blocked=true;}else if(c?.zrijeb_formiran){message='Žrijeb ove kategorije je formiran. Nove prijave su zaključane.';blocked=true;}else if(c&&Number(c.zauzeto)>=Number(c.limit_ucesnika)){blocked=![true,'TRUE','DA'].includes(c.lista_cekanja);message=blocked?'Kategorija je popunjena. Lista čekanja nije uključena.':'Kategorija je popunjena. Prijava će biti upisana na listu čekanja.';}$('formAvailability').textContent=message;$('submit').disabled=blocked||!token||submitting;}
function renderPlayers(){let q=$('playerSearch').value.toLocaleLowerCase(),cat=$('playerCategory').value,rows=data.ucesnici.filter(p=>(!cat||p.kategorija_id===cat)&&[p.javno_ime,p.klub_grad].join(' ').toLocaleLowerCase().includes(q));$('players').innerHTML=rows.length?'<div class="player-grid">'+rows.map(p=>'<article class="player-card"><span class="avatar" aria-hidden="true">'+escape(p.javno_ime.split(' ').slice(-2).map(x=>x[0]).join(''))+'</span><div><h3>'+escape(p.javno_ime)+(p.nosilac?' <span class="badge">'+escape(p.nosilac)+'</span>':'')+'</h3><p>'+escape(category(p.kategorija_id))+'</p><p>'+escape(p.klub_grad||'')+'</p></div></article>').join('')+'</div>':empty('Nema učesnika za odabranu pretragu.');}
function renderDraw(){let cat=$('drawCategory').value,ms=data.mecevi.filter(m=>m.kategorija_id===cat),rs=[...new Set(ms.map(m=>Number(m.runda)))].sort((a,b)=>a-b);if(!rs.length){$('roundTabs').innerHTML='';$('bracket').innerHTML=empty('Žrijeb za ovu kategoriju još nije objavljen.');return;}if(round!=='all'&&!rs.includes(Number(round)))round='all';$('roundTabs').innerHTML=[['all','Sve runde'],...rs.map(r=>[r,roundName(ms.find(m=>Number(m.runda)===r))])].map(([id,name])=>'<button type="button" data-round="'+id+'" aria-pressed="'+(String(round)===String(id))+'">'+escape(name)+'</button>').join('');let visible=round==='all'?rs:[Number(round)];$('bracket').innerHTML='<div class="round-grid '+(visible.length===1?'single':'')+'">'+visible.map(r=>'<div><div class="round-title">'+escape(roundName(ms.find(m=>Number(m.runda)===r)))+'</div>'+ms.filter(m=>Number(m.runda)===r).sort((a,b)=>a.pozicija-b.pozicija).map(card).join('')+'</div>').join('')+'</div>';}
function renderMatches(){let d=$('matchDay').value,c=$('matchCategory').value,t=$('matchCourt').value,s=$('matchStatus').value;let ms=data.mecevi.filter(m=>(!d||dayKey(m.pocetak)===d)&&(!c||m.kategorija_id===c)&&(!t||m.teren_id===t)&&(!s||m.status===s)).sort((a,b)=>(a.pocetak||'9999').localeCompare(b.pocetak||'9999'));$('matches').innerHTML=ms.length?ms.map(card).join(''):empty('Nema mečeva za odabrane filtere.');}
function route(){let id=location.hash.slice(1)||'pregled';if(!['pregled','prijava','ucesnici','zrijeb','raspored','pravila'].includes(id))id='pregled';document.querySelectorAll('.page').forEach(el=>el.hidden=!data||el.id!==id);document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});}
async function refresh(){if(loading)return;loading=true;$('refresh').disabled=true;try{let next=await rpc('getPublicData');if(!next?.turnir||!Array.isArray(next.mecevi))throw new Error('Neispravan odgovor.');data=next;lastSuccess=new Date();$('initial').hidden=true;render();$('syncStatus').textContent='Posljednje uspješno osvježavanje '+date(lastSuccess.toISOString(),{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · očitano '+date(data.readAt,{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('syncStatus').parentElement.classList.remove('error');}catch(e){$('syncStatus').textContent=lastSuccess?'Osvježavanje nije uspjelo. Prikazani su posljednji uspješni podaci od '+date(lastSuccess.toISOString(),{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'.':'Baza nije dostupna. Pokušajte ponovo dugmetom Osvježi.';$('syncStatus').parentElement.classList.add('error');if(!data)$('initial').textContent='Podaci trenutno nisu dostupni. Nijedna prijava nije poslata.';}finally{loading=false;$('refresh').disabled=false;}}
async function challenge(){if(challengeBusy)return;challengeBusy=true;token='';availability();try{let v=await rpc('getRegistrationChallenge');token=v.token;}catch(e){$('formMessage').textContent='Provjera obrasca nije dostupna. Pokušajte ponovo.';}finally{challengeBusy=false;availability();}}
form.addEventListener('submit',async e=>{e.preventDefault();if($('submit').disabled||!data)return;let values=Object.fromEntries(new FormData(form));let payload={...values,saglasnost:form.elements.saglasnost.checked,verzija_pravila:consentVersion,zahtjev_id:requestId,token};submitting=true;$('submit').disabled=true;$('formMessage').className='form-message';$('formMessage').textContent='Slanje prijave…';try{let result=await rpc('submitRegistration',payload);if(!result.ok)throw new Error('Upis nije potvrđen.');$('formMessage').className='form-message success';$('formMessage').textContent=((isDemo||[true,'TRUE','DA'].includes(data.turnir.demo))?'DEMO — probni upis, nije stvarna prijava.\n':'Prijava je uspješno upisana.\n')+'Status: '+result.status+'\nBroj prijave: '+result.id+'\nSačuvajte ovaj broj za kontakt sa organizatorom.';form.reset();requestId=crypto.randomUUID();await challenge();await refresh();}catch(err){$('formMessage').className='form-message error';$('formMessage').textContent=err.message||'Upis nije potvrđen. Pokušajte ponovo.';}finally{submitting=false;availability();}});
form.elements.saglasnost.onchange=()=>{consentVersion=form.elements.saglasnost.checked?data?.turnir.verzija_pravila:'';};$('refresh').onclick=refresh;$('challengeRefresh').onclick=challenge;$('formCategory').onchange=availability;$('playerSearch').oninput=()=>data&&renderPlayers();$('playerCategory').onchange=()=>data&&renderPlayers();$('drawCategory').onchange=()=>{round='all';if(data)renderDraw();};$('roundTabs').onclick=e=>{const button=e.target.closest('[data-round]');if(button){round=button.dataset.round;renderDraw();}};['matchDay','matchCategory','matchCourt','matchStatus'].forEach(id=>$(id).onchange=()=>data&&renderMatches());$('print').onclick=()=>window.print();window.addEventListener('hashchange',route);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});setInterval(()=>{if(!document.hidden)refresh();},60000);
if(isDemo){$('demo').hidden=false;$('outage').onclick=()=>{fakeOutage=!fakeOutage;$('outage').textContent=fakeOutage?'Obnovi vezu':'Simuliraj prekid veze';refresh();};}
refresh();challenge();
})();
</script>
